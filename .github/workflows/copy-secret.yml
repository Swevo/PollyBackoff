name: Copy NUGET_API_KEY to sibling repos

on:
  workflow_dispatch:

jobs:
  copy-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Copy NUGET_API_KEY to all sibling repos
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
        run: |
          echo "$NUGET_API_KEY" | gh secret set NUGET_API_KEY --repo Swevo/Polly.Contrib.Caching
          echo "$NUGET_API_KEY" | gh secret set NUGET_API_KEY --repo Swevo/Polly.Contrib.Bulkhead
          echo "$NUGET_API_KEY" | gh secret set NUGET_API_KEY --repo Swevo/PollyOpenAI
          echo "$NUGET_API_KEY" | gh secret set NUGET_API_KEY --repo Swevo/PollyRedis
          echo "$NUGET_API_KEY" | gh secret set NUGET_API_KEY --repo Swevo/PollySignalR
          echo "$NUGET_API_KEY" | gh secret set NUGET_API_KEY --repo Swevo/PollyGrpc
          echo "$NUGET_API_KEY" | gh secret set NUGET_API_KEY --repo Swevo/PollyKafka
          echo "Done"