name: Copy NUGET_API_KEY to PollyChaos

on:
  workflow_dispatch:

jobs:
  copy-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Copy NUGET_API_KEY to PollyChaos
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
        run: |
          echo "$NUGET_API_KEY" | gh secret set NUGET_API_KEY --repo Swevo/PollyChaos
          echo "Done"
